    <main>
        <h1>Contact</h1>
        <p>Vul het formulier in om mij een bericht te sturen.</p>
        <form class="contact-form">
            <label for="voornaam">Voornaam</label>
            <input id="voornaam" name="Voornaam" type="text" required>

            <label for="achternaam">Achternaam</label>
            <input id="achternaam" name="Achternaam" type="text" required>

            <label for="email">E-mailadres</label>
            <input id="email" name="E-mailadres" type="email" required>

            <label for="onderwerp">Onderwerp</label>
            <input id="onderwerp" name="Onderwerp" type="text" required>

            <label for="bericht">Bericht</label>
            <textarea id="bericht" name="Bericht" rows="6" required></textarea>

            <button type="button">Verstuur bericht</button>
        </form>
    </main>

    <footer>© Berkin Çelik</footer>
